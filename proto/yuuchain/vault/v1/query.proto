syntax = "proto3";

package yuuchain.vault.v1;

import "cosmos_proto/cosmos.proto";
import "google/api/annotations.proto";
import "yuuchain/vault/v1/params.proto";

// NOTE:
// - This file must live under proto/ so make proto-gen can generate Go types.
// - It mirrors the vault Query service that your keeper / CLI expect.

option go_package = "github.com/evmos/evmos/v20/x/vault/types";

// Query defines the gRPC query service for the vault module.
service Query {
  // Params returns the vault module parameters.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/yuuchain/vault/v1/params";
  }

  // Deposit returns the deposit balance for a given address.
  rpc Deposit(DepositRequest) returns (DepositResponse) {
    option (google.api.http).get = "/yuuchain/vault/v1/deposits/{address}";
  }

  // Total returns the total recorded deposits across all users.
  rpc Total(TotalRequest) returns (TotalResponse) {
    option (google.api.http).get = "/yuuchain/vault/v1/total";
  }

  // External returns total externally locked USDT (USDT.yuu).
    rpc External(TotalRequest) returns (TotalResponse) {
      option (google.api.http).get = "/yuuchain/vault/v1/external";
    }

 // ExternalByNetwork returns externally locked USDT for a specific source network.
   rpc ExternalByNetwork(ExternalByNetworkRequest) returns (ExternalByNetworkResponse) {
    option (google.api.http).get = "/yuuchain/vault/v1/external/{network}";
}

  // Price returns the current YUU coin price.
  rpc Price(PriceRequest) returns (PriceResponse) {
    option (google.api.http).get = "/yuuchain/vault/v1/price";
  }

  // BridgeOperator returns the currently authorized bridge operator address.
  rpc BridgeOperator(QueryBridgeOperatorRequest) returns (QueryBridgeOperatorResponse) {
    option (google.api.http).get = "/yuuchain/vault/v1/bridge_operator";
  }
}

// ---------------------------- Messages ----------------------------

// Params
message QueryParamsRequest {}
message QueryParamsResponse {
  Params params = 1;
}

// BridgeOperator
message QueryBridgeOperatorRequest {}
message QueryBridgeOperatorResponse {
  string operator = 1;
}

// Deposit
message DepositRequest {
  string address = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
message DepositResponse {
  string amount = 1;
}

// Total
message TotalRequest {}
message TotalResponse {
  string total = 1;
}

// Price
message PriceRequest {}
message PriceResponse {
  string price = 1;
}
// ExternalByNetwork
message ExternalByNetworkRequest {
  string network = 1;
}

message ExternalByNetworkResponse {
  string total = 1; // uusdt
}
