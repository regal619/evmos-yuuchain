syntax = "proto3";

package yuuchain.vault.v1;

import "cosmos_proto/cosmos.proto";
import "cosmos/msg/v1/msg.proto";
import "yuuchain/vault/v1/params.proto";

option go_package = "github.com/evmos/evmos/v20/x/vault/types";

// Msg defines the vault module's tx service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams allows the authority to update module params.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // Deposit is the existing "proof-of-deposit" entry point (for uusdt etc.).
  rpc Deposit(MsgDeposit) returns (MsgDepositResponse);
 
 // Mint YUU based on an external (e.g. Ethereum) deposit that has been verified off-chain.
  rpc MintFromBridge(MsgMintFromBridge) returns (MsgMintFromBridgeResponse);
}

// ------------------------- Messages -------------------------

// MsgUpdateParams updates the vault params; only gov/authority can call it.
message MsgUpdateParams {
  // signer is the authority
  option (cosmos.msg.v1.signer) = "authority";

  string authority = 1;
  Params params   = 2;
}

message MsgUpdateParamsResponse {}

// MsgDeposit represents a deposit of "units" into the vault.
// You already have this wired and live on-chain.
message MsgDeposit {
  // signer is the depositor
  option (cosmos.msg.v1.signer) = "creator";

  // Bech32 account address of the depositor.
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // Logical "units" of deposit (we've been using it as your uUSD-style units).
  // In your existing Go code this is treated as an integer count.
  uint64 units   = 2;
}

message MsgDepositResponse {}
// MintFromBridge allows a privileged bridge operator to mint YUU
// for an address, based on a verified external deposit (e.g. ETH
// into the YuuEthVault on Sepolia).
message MsgMintFromBridge {
// signer is the bridge operator
 option (cosmos.msg.v1.signer) = "creator";

  // The signer on YuuChain (bridge operator).
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // YuuChain recipient who will receive the newly minted YUU.
  string recipient = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // Amount of YUU to mint, in uyuu (1e18).
  string amount_uyuu = 3;

  // Source network identifier, e.g. "sepolia".
  string source_network = 4;

  // Source chain transaction hash (Ethereum tx hash).
  string source_tx_hash = 5;

  // Optional: JSON blob describing the external deposit in more detail
  // (vault address, from, to, block number, etc.). This can be used
  // for off-chain auditing and double-deposit detection.
  string source_metadata_json = 6;
  // Stablecoin identity on the source chain.
  // Examples: "USDT", "USDC"
  string token_symbol = 7;

  // Token contract address on the source chain.
  // - EVM: 0x...
  // - Tron (later, if you support it): base58
  string token_address = 8;

  // Amount of externally locked USDT, in uusdt (1e6 precision).
  // Accounting-only: mirrors ETH escrow into the vault.
  uint64 source_amount_uusdt = 9;
}

// Empty response for now, can be extended later if needed.
message MsgMintFromBridgeResponse {}
